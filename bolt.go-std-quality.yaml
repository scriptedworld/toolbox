# bolt.go-std-quality.yaml — the standard quality gate for a Go project.
#
# What a Go project is checked for, written in terms of the tools that check it.
#
# OVERLAY THE COMMON DEFINITION UNDER THIS ONE. The checks that do not care what
# language you wrote live there, and this file assumes they are present:
#
#     bolt -c bolt.common-quality.yaml -c bolt.go-std-quality.yaml
#
# A project adjusts by overlaying a third file. Later files win and tasks merge
# by id, so an overlay setting only `timeout` keeps the command it inherited:
#
#     bolt -c bolt.common-quality.yaml \
#          -c bolt.go-std-quality.yaml \
#          -c bolt.this-project.yaml
#
# Nothing here says what success means. A task either names a result_command,
# whose returned envelope is the verdict entire, or it names nothing and exiting
# 0 is its contract. The thing that knows whether a tool's output is good is the
# thing that read the output.
#
# Ordered cheapest first, so a failure surfaces before the slow checks run.
#
# THE PATH RULE: a path resolves against {configdir} if it travels with this
# file -- an adapter, a linter config. A path stays relative to the run root if
# it belongs to the project being checked. See bolt.common-quality.yaml for the
# measurement behind that.

version: 1

tasks:
  # ---- shape ----------------------------------------------------------------

  # gofmt lists unformatted files on stdout and exits 0 either way, so its exit
  # status answers "did gofmt run", never "is this formatted". That is exactly
  # what a result_command is for.
  - id: format
    description: every file is gofmt-clean
    tags: [quick, ci]
    requires: [gofmt, python3]
    command: "gofmt -l ."
    result_command: "python3 {configdir}/adapters/go/gofmt.py"

  # -diff exits non-zero when go.mod or go.sum would change, without changing
  # them. A tidy that mutates the tree during a check is a check with a side
  # effect.
  - id: tidy
    description: go.mod and go.sum are already tidy
    tags: [quick, ci]
    requires: [go]
    command: "go mod tidy -diff"

  # ---- correctness ----------------------------------------------------------

  - id: build
    description: every package compiles
    tags: [quick, ci]
    requires: [go]
    command: "go build ./..."

  - id: vet
    description: the compiler-adjacent checks that need no configuration
    tags: [quick, ci]
    requires: [go, python3]
    command: "go vet ./..."
    result_command: "python3 {configdir}/adapters/go/govet.py"

  # ---- the aggregator -------------------------------------------------------

  # golangci-lint bundles 42 analysers behind one AST parse, which is why it is
  # one task rather than forty-two.
  #
  # The config is named explicitly, and that is not fussiness. `golangci-lint
  # run` with no --config searches for one and, finding none, silently runs its
  # five default linters -- a far weaker gate wearing the same name and
  # reporting the same "0 issues". This descriptor did exactly that until it was
  # measured. Naming the file makes its absence an error.
  #
  # The config travels with this file: the pair is the definition, and neither
  # half means anything without the other.
  - id: lint
    description: the golangci-lint aggregator, 42 analysers
    tags: [ci]
    requires: [golangci-lint]
    command: "golangci-lint run --config {configdir}/config/go-std-quality.golangci.yml"
    timeout: 300s

  # ---- tests ----------------------------------------------------------------

  # -covermode=atomic is required alongside -race: the default `set` mode writes
  # the counters non-atomically, so the race detector reports on the
  # instrumentation itself and the counts are quietly wrong.
  #
  # The coverage profile is a declared output. A test run that reports success
  # without producing one did not measure anything, and declaring the file is
  # what turns that from a silent gap into a failure.
  - id: tests
    description: race, shuffle and a coverage profile
    tags: [ci]
    requires: [go]
    command: "CGO_ENABLED=1 go test -race -shuffle=on -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./..."
    timeout: 600s
    output:
      - path: coverage.out
        format: text

  # Coverage is judged PER FILE. There is deliberately no aggregate threshold:
  # an aggregate is exactly what lets a well-tested file carry an untested one.
  # The total is reported in statistics as context and nothing branches on it.
  #
  # This reads the profile `tests` produced, so it has to run after it -- which
  # declaration order gives, tasks being run in the order written.
  #
  # Generated code is excluded because nobody writes tests for it and its size
  # would otherwise dominate.
  - id: coverage
    description: every file at or above 80% of statements
    tags: [ci]
    requires: [python3]
    command: "test -f coverage.out"
    result_command: >-
      python3 {configdir}/adapters/go/coverage.py --min 80
      --exclude '\.pb\.go$' --exclude '\.gen\.go$' --exclude '_generated\.go$'

  # ---- supply chain ---------------------------------------------------------

  # Reachability-based: only reports vulnerabilities actually called, rather
  # than every advisory touching a module in go.sum.
  - id: vuln
    description: vulnerabilities in code that is actually reached
    tags: [ci]
    requires: [govulncheck]
    command: "govulncheck ./..."
    timeout: 300s

# ---- DELIBERATELY NOT HERE ---------------------------------------------------
#
# `entrypoint` -- measuring the one statement in main() that `go test` can never
# reach, by building the binary with `go build -cover`, running it once, and
# appending the profile.
#
# It was in this file and it does not belong in a SHARED definition, because it
# names the project's own main package and its own smallest safe invocation:
#
#     go build -cover ... -o "$BOLT_SCRATCH/bolt" ./cmd/bolt && ... "$BOLT_SCRATCH/bolt" help
#
# Every Go project has a different path there and a different harmless command,
# and bolt has no substitution that could stand in for either. Left here, it
# fails for every adopter on the first run -- which is worse than being absent,
# because it fails in a way that looks like the adopter's fault.
#
# It belongs in the project's own overlay, where the hardcoding is correct
# because the file is about that one project:
#
#     # bolt.this-project.yaml
#     tasks:
#       - id: entrypoint
#         description: the built binary runs, so its one statement is measured
#         tags: [ci]
#         requires: [go]
#         command: >-
#           go build -cover -covermode=atomic -coverpkg=./... -o "$BOLT_SCRATCH/app" ./cmd/app && ...
#
# The underlying rule is worth stating once: a shared definition carries the
# rule and never the subject. `entrypoint` looked like a rule and was a subject.
