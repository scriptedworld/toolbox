# Standard quality gate for a Go project.  Run it with bolt.common-quality,
# which holds traceability, suppressions and secrets.
#
#     bolt go-std-quality .
#
# Ordered cheapest first, so a failure surfaces before the slow checks run.
#
# The path rule: a path resolves against {config_dir} if it travels with this
# file; it stays relative to the base if it belongs to the project being checked.
#
# Every task gates on its exit code, and two only do so because their commands
# were written to.  `gofmt -l` and `test -f` exit 0 whatever they find, so a
# task running them bare passes forever.  If a command's exit status does not
# answer the question the task asks, rewrite the command or drop the task.

version: "1.0.0"

requires:
  - go
  - gofmt
  - golangci-lint
  - govulncheck

# The entrypoint step, defaulted so a project without a binary is unaffected.
#
# main() holds statements no test process can reach, because nothing in a test
# calls main(). Hard rule 5 says measure it and never exclude it, so the
# binary is built with -cover, run once, and its profile merged with the test
# one. Both are declared evidence of the `tests` task and both reach the
# adapter, which is what keeps this inside FR-4.6: one script, one exit code,
# one work directory.
#
# A placeholder is one argument, so this names a program and never a command
# line. FR-4.16c holds a defined value to a scalar and substitute.go shell-
# quotes it, which makes "a definition meaning several arguments" inexpressible
# by design. Supplying the whole build-and-run chain as the value fails with
# `sh: 1: go build ...: not found`, exit 127, and {work_dir} inside the value is
# never expanded because substitution does not recurse.
#
# So the task writes the empty profile itself, then hands the work directory to
# one program. The default is `true`, which ignores its argument and leaves the
# empty profile standing, so a project with no binary needs no definitions file
# and is unaffected. A project with a binary names a script that overwrites it.
#
# A definitions file is a flat mapping of name to scalar, and carries no
# `definitions:` wrapper. The block below has one because it sits inside a
# larger document; `bolt.go-std-quality.definitions.yaml` is nothing else, so it
# is the mapping alone:
#
#     entrypoint: scripts/cover-entrypoint.sh
#
# wrench's definitions schema refuses the wrapped guess, and reports the value's
# type at `/definitions` instead of the shape of the file.
#
# The evidence is declared unconditionally because it must be: declaring it
# conditionally is not expressible either, and bolt refuses a task that does not
# produce evidence it declared. Hence an empty profile and never an absent
# one. It merges as a no-op, being a mode line and nothing else.
definitions:
  entrypoint: 'true'

tasks:
  # ---- shape ----------------------------------------------------------------

  # gofmt lists unformatted files on stdout and exits 0 either way, so its exit
  # status answers "did gofmt run", never "is this formatted". `test -z` on its
  # output is what makes this a gate. The file list is lost from the verdict and
  # returns with the adapter in `port-the-jigs/10`; it is still in captured
  # stdout meanwhile.
  - name: format
    description: every file is gofmt-clean
    command: test -z "$(gofmt -l .)"

  # -diff exits non-zero when go.mod or go.sum would change, without changing
  # them. A tidy that mutates the tree during a check is a check with a side
  # effect.
  - name: tidy
    description: go.mod and go.sum are already tidy
    command: go mod tidy -diff

  # ---- correctness ----------------------------------------------------------

  - name: build
    description: every package compiles
    command: go build ./...

  - name: vet
    description: the compiler-adjacent checks that need no configuration
    command: go vet ./...

  # ---- the aggregator -------------------------------------------------------

  # golangci-lint bundles 42 analysers behind one AST parse, which is why it is
  # one task and not forty-two.
  #
  # The config is named explicitly. `golangci-lint run` with no --config
  # searches for one and, finding none, silently runs its five default linters:
  # a far weaker gate wearing the same name and reporting the same "0 issues".
  # Naming the file makes its absence an error.
  #
  # The config travels with this file: the pair is the definition, and neither
  # half means anything without the other.
  - name: lint
    description: the golangci-lint aggregator, 42 analysers
    command: golangci-lint run --config {config_dir}/config/go-std-quality.golangci.yml

  # ---- tests ----------------------------------------------------------------

  # -covermode=atomic is required alongside -race: the default `set` mode writes
  # the counters non-atomically, so the race detector reports on the
  # instrumentation itself and the counts are quietly wrong.
  #
  # The profile is declared evidence. A test run that reports success without
  # producing one did not measure anything, and declaring the file is what turns
  # that from a silent gap into a failure.
  #
  # Coverage is judged here and not by a task of its own, because a task's
  # work directory is its own and the profile is written into this one. A
  # separate task would have no path to it that did not hardcode a sibling's
  # directory. The adapter therefore answers for both: it reads the captured
  # exit status, so a suite that failed while leaving a profile behind is a
  # failure, and it judges the profile per file at 80% of statements. No
  # aggregate threshold, because an aggregate is what lets a well-tested file
  # carry an untested one; the total is reported in statistics as context and
  # nothing branches on it.
  #
  # -coverpkg=./... means a file's number counts statements reached by any
  # package's tests, not only its own. That is what should be gated, since it
  # measures what is actually exercised, but it is not unit-test coverage and
  # should not be read as one.
  - name: tests
    description: race, shuffle, and coverage judged per file including the entry point
    command: >-
      CGO_ENABLED=1 go test -race -shuffle=on -covermode=atomic
      -coverpkg=./... -coverprofile={work_dir}/cover-test.out ./... &&
      printf 'mode: atomic\n' > {work_dir}/cover-entry.out &&
      {entrypoint} {work_dir}
    evidence:
      - cover-test.out
      - cover-entry.out
    adapter: adapters/go/coverage.py

  # ---- supply chain ---------------------------------------------------------

  # Reachability-based: reports only vulnerabilities actually called, not every
  # advisory touching a module in go.sum.
  - name: vuln
    description: vulnerabilities in code that is actually reached
    command: govulncheck ./...

# ---- why there is no branch coverage here -------------------------------------
#
# Go does not measure it. `-covermode` offers set, count and atomic, and all
# three count statements. The unit is the basic block, so an `if` body is its
# own block and this is stronger than line coverage, but the false path of an
# `if` with no `else` is not something the toolchain can see.
#
# Tools that advertise branch coverage for Go fill the branch fields of a
# Cobertura document from statement data. Gating on those numbers would report a
# guarantee nothing established, which is the same failure as gating on
# `test -f`. So the gate measures statements and says so.
