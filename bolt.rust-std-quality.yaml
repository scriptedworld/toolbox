# Rust's standard checks.
#
#     bolt rust-std-quality .          flags before the positionals
#
# The path rule. A path resolves against {config_dir} if it travels with this
# file: a checker, a linter's config. It stays relative to the base if it
# belongs to the project being checked. Getting this backwards works in a
# repository whose jig sits at its own root, where the two are the same
# directory, and breaks for every adopter.
#
# The standard is the category list in `bolt.deno-std-quality.yaml`'s header,
# taken from the Python jig. Where Rust differs from Python, and why each absent task is absent:
#
#   types        the compiler does it. There is no mypy-shaped task because
#                there is no mypy-shaped gap; `cargo build` failing is the
#                type check.
#   dead code    `dead_code` is a rustc warning and the lint task turns
#                warnings into failures, so there is no vulture counterpart.
#   docstrings   `missing_docs` is a lint a project sets in its own Cargo.toml
#                and is not a tool, so interrogate has no counterpart. What is
#                lost is the number: interrogate reports a percentage and this
#                reports pass or fail.
#   unused deps  cargo-udeps would be the task. It is not in `requires` because
#                a run naming a tool that is not installed is refused, and it is
#                not installed here.
#
# Ordered cheapest first, so a failure surfaces before the slow checks run.

version: "1.0.0"

requires:
  - cargo
  # cargo-clippy is a separate binary, and `cargo` being present says nothing
  # about it. Naming it here refuses the run up front instead of three tasks in.
  - cargo-clippy
  - rustfmt
  # A cargo subcommand is a separate binary too. Naming only `cargo` lets three
  # tasks fail halfway through a run on a machine missing them.
  - cargo-llvm-cov
  - cargo-audit
  - cargo-deny
  - python3

definitions:
  # Not the compiler's default of 0. Failing on the first warning is what makes
  # `dead_code` and `missing_docs` fail the gate.
  deny: warnings

tasks:
  # The version of every tool `requires:` names, read from this file, so a
  # verdict records what produced it (FR-1.8). Fails when a tool reports none.
  - name: versions
    description: the version of every required tool, recorded in this run's output
    command: python3 {config_dir}/bin/tool-versions.py {config_dir}/bolt.rust-std-quality.yaml

  # ---- shape ----------------------------------------------------------------

  # --check reports without writing. A formatter that reformats during a check
  # leaves CI green against a tree nobody has seen.
  - name: format
    description: every file is rustfmt clean
    command: cargo fmt --check

  # --all-targets reaches tests and benches, not only the binary. Without it a
  # test file can carry anything and the gate stays green.
  #
  # The four complexity lints are enabled here and not in a task of their own,
  # because clippy is already parsing the crate and a second pass would pay for
  # that twice. `-D {deny}` promotes them from warnings to failures like every
  # other lint.
  #
  # Complexity belongs to each language jig and not the common one;
  # `bolt.common-quality.yaml` says why. The thresholds live in
  # {config_dir}/config/rust, which clippy finds by directory and not by path,
  # hence CLIPPY_CONF_DIR.
  - name: lint
    description: clippy including complexity, with warnings refused
    command: >-
      env CLIPPY_CONF_DIR={config_dir}/config/rust
      cargo clippy --all-targets --
      -D {deny}
      -W clippy::cognitive_complexity
      -W clippy::too_many_arguments
      -W clippy::too_many_lines
      -W clippy::excessive_nesting

  # ---- correctness ----------------------------------------------------------

  # There is no separate type task. The compiler is the type checker, so this
  # failing is what mypy failing would be in the Python jig.
  - name: build
    description: every target compiles
    command: cargo build --all-targets

  # Coverage is judged here and not by a task of its own, because a task's
  # work directory is its own and the profile is written into this one. A
  # separate task would have no path to it that did not hardcode a sibling's
  # directory. The adapter therefore answers for both: it reads the captured
  # exit status, so a suite that failed while leaving a profile behind is a
  # failure, and it judges the profile per file at 80% of lines. No aggregate
  # threshold, because an aggregate is what lets a well-tested file carry an
  # untested one; the total is reported in statistics as context.
  #
  # Lines, not statements. lcov's `DA` records count executable lines where Go's
  # profile counts statements per block, so 80% here and 80% there use
  # different denominators.
  - name: tests
    description: the suite, and coverage judged per file against the profile it writes
    command: >-
      cargo llvm-cov --all-targets --lcov
      --output-path {work_dir}/coverage.lcov
    evidence:
      - coverage.lcov
    adapter: adapters/lcov/coverage.py

  # ---- security -------------------------------------------------------------

  # Advisories against what is actually in the lockfile.
  - name: vuln
    description: no dependency carries a known advisory
    command: cargo audit

  # Licences, duplicate versions and source registries. Separate from vuln
  # because it answers a different question and fails for different reasons.
  - name: licences
    description: dependency licences and sources are permitted
    command: cargo deny check
