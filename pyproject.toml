# This repository ships scripts that bolt invokes by path, never a package anyone
# installs. It carries a [project] table anyway, and `package = false` is what
# keeps both halves of that true: uv builds an environment and does not build a
# distribution.
#
# WHY IT NEEDS ONE. The Python jig's `tests` task runs the suite under coverage,
# and pytest and coverage are separate `uv tool` installations that cannot see
# each other, so `coverage run -m pytest` fails with `No module named pytest` on
# a machine where both are installed. Measured 2026-09-04: the task had never
# run here, and reported `evidence-missing` rather than a coverage figure.
#
# The jig now runs it through `uv run`, which is what every Python adopter can
# offer: skid already had one, wrench's pack has one, and this is toolbox's.
# Declaring the test tools here rather than relying on what happens to be on
# PATH is also the direction anvil needs — `requires:` names executables, and an
# environment is what actually has to exist.
[project]
name = "toolbox"
version = "0"
requires-python = ">=3.12"

[tool.uv]
# No distribution is built. There is nothing here to install.
package = false

[dependency-groups]
# The suite's tools, and PyYAML because the checkers and adapters import it and
# `requires:` cannot yet declare a library. See anvil's NEXT_STEPS.
#
# wrench is here because `tests/test_jigs.py` validates every jig against the
# schema wrench ships, rather than against a copy kept here. That is NFR-6
# settled: a copy could only be a second description free to disagree with the
# one being enforced, and it disagreed twice before it was deleted.
dev = ["pytest", "coverage", "pyyaml", "wrench", "mypy"]

# wrench is not on a registry, so it is named by git URL, exactly as skid does.
# A path source would tie this repository to a sibling checkout and break a
# standalone clone.
[tool.uv.sources]
wrench = { git = "https://github.com/scriptedworld/wrench.git", subdirectory = "python" }

# ONE LINE LENGTH, DECLARED ONCE, AND BOTH TOOLS PINNED TO IT.
#
# 150 is the estate's number. Before this, NEITHER tool enforced it: ruff's
# default rule set does not include E501 at all, so ruff checked no length, and
# pylint's default of 100 was the only limit in play. Three lines at 101 to 103
# characters failed `analyse` against a limit nobody had chosen, while the
# declared standard went unenforced.
#
# That is the shape `docs/LESSONS/a-dead-threshold-is-a-latent-relaxation.md`
# describes, in its worst form: not two tools disagreeing about one property,
# but two tools neither of which held the number the project meant.
#
# `line-length` drives ruff's formatter as well as its linter. Measured
# 2026-08-29 before changing it: no file reflows at 150, because the formatter
# does not expand code already wrapped shorter.
[tool.ruff]
line-length = 150

[tool.ruff.lint]
# E501 is line length, and it is selected explicitly because ruff's defaults
# leave it out. Declaring the number without selecting the rule would be a limit
# that cannot bind, which is the same fault one step earlier.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# N999 is "invalid module name", and this file's name is deliberate: the
# adapters and checkers are scripts bolt invokes by path, never modules imported
# by name, and the estate spells a script's name with hyphens throughout.
#
# It began firing on 2026-09-04, when these directories gained the `__init__.py`
# that lets coverage see an adapter no test executed. The marker changed how ruff
# classifies the file; it did not change what the file is or how it is reached.
"adapters/common/bolt-result.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bin/test-traceability.py is a checker, not a test file. It does not match
# test_*.py because of the hyphen, and testpaths keeps collection out of bin/
# regardless, but saying so here means a later rename cannot quietly turn a
# checker into a collected test module.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
# THE ROOTS, AND THE REASON EACH ADAPTER DIRECTORY CARRIES AN `__init__.py`.
# coverage adds a file that no test executed to the report only where it can
# reach it as a package. The adapters are standalone scripts loaded by path, so
# their directories had no marker, and the report therefore carried the adapters
# that ran and silently omitted every one that did not — which is exactly the
# file a per-file coverage gate exists to catch.
#
# Measured 2026-09-04: four files were reported where ten exist. The five
# missing were bolt-result, govet, lizard and the Rust and Python coverage
# adapters, all of them at nothing rather than at 0%.
#
# NAMING THE LEAF DIRECTORIES HERE ALSO WORKS AND IS WORSE. Each Cobertura
# `filename` is relative to the source root that contains it, so with the leaves
# named, `adapters/go/coverage.py`, `adapters/python/coverage.py` and
# `adapters/rust/coverage.py` all report as `coverage.py` and the adapter merges
# three different files into one entry. Two roots and a marker per subdirectory
# keeps the paths distinct.
source = ["bin", "adapters"]

[tool.coverage.report]
# The scripts are invoked by path and loaded by path, so show them by path.
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's: the jig
# runs a bare `mypy .` and says so in its own comment. What it needs from here
# is only that third-party imports resolve.
#
# `types-PyYAML` is the better answer than ignoring yaml and is not used because
# nothing in this repository declares runtime dependencies: bolt invokes these
# scripts by path against whatever interpreter anvil built. Revisit when anvil
# carries the stub packages: see NEXT_STEPS.
#
# `wrench` joined the list 2026-08-29 when the local schema copies went and the
# tests began importing the pack that ships them, which settles NFR-6. It is
# resolvable at runtime by editable install and not by mypy's path.
#
# `jsonschema` and `referencing` left it the same day: the suite validated jigs
# by assembling its own validator and now calls the one wrench ships, so neither
# is imported here any more.
[[tool.mypy.overrides]]
module = ["yaml", "pytest", "wrench"]
ignore_missing_imports = true

# PYLINT RUNS ONLY WHAT RUFF CANNOT, which is what the shared jig's own header
# has always claimed and what nothing configured. `analyse` runs a bare
# `pylint --recursive=y`, so it ran pylint's ENTIRE default rule set here.
# Measured 2026-08-29: 16 findings, of which ONE was cross-module analysis and
# the rest were rules ruff already runs. toolbox was the only one of three
# adopters of the Python jig with no pylint configuration at all.
#
# AN ALLOWLIST, NOT A DENYLIST. A denylist has to be remembered every time ruff
# gains a rule and will not be; an allowlist is wrong in the safe direction, by
# missing a new pylint check rather than by silently running a duplicate. The
# shape is wrench's, arrived at independently there and adopted here on its
# reasoning rather than by copying its list.
#
# EVERY ENTRY NEEDS MORE THAN ONE FILE IN VIEW, OR TYPE INFERENCE. That is the
# test each one is held to, and it is what pylint's slowness is being paid for.
# `duplicate-code` is the clearest case: ruff has no equivalent and cannot have
# one, because it is a whole-program question.
#
# What is deliberately NOT here, so it is not added back by habit:
# `line-too-long` and `invalid-name` and `missing-function-docstring` are all
# single-file judgements. ruff owns line length above, at the estate's 150.
# The module names it objects to are hyphenated because these are EXECUTABLES
# invoked by path rather than importable modules, which is deliberate and is
# why a naming rule is the wrong instrument for them.
[tool.pylint."MESSAGES CONTROL"]
disable = ["all"]
enable = [
    "duplicate-code",
    "cyclic-import",
    "no-member",
    "not-callable",
    "no-value-for-parameter",
    "unexpected-keyword-arg",
    "import-error",
    "arguments-differ",
    "abstract-method",
    "attribute-defined-outside-init",
    "inconsistent-return-statements",
]
