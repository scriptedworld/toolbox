# This repository ships scripts that bolt invokes by path, never a package anyone
# installs. It carries a [project] table anyway, and `package = false` is what
# keeps both halves of that true: uv builds an environment and does not build a
# distribution.
#
# Why it needs one. The Python jig's `tests` task runs the suite under coverage.
# Installed as separate `uv tool` environments, pytest and coverage cannot see
# each other, so `coverage run -m pytest` fails with `No module named pytest` on
# a machine where both are installed, and the task reports `evidence-missing`
# instead of a coverage figure.
#
# The jig runs it through `uv run`, so every Python adopter declares an
# environment, and this is toolbox's. The test tools are declared here instead
# of taken from PATH, which also suits anvil: `requires:` names executables, and
# an environment is what has to exist.
[project]
name = "toolbox"
version = "0"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.uv]
# No distribution is built.
package = false

[dependency-groups]
# The suite's tools, and PyYAML because the checkers and adapters import it and
# `requires:` cannot yet declare a library. See anvil's NEXT_STEPS.
#
# wrench is here because `tests/test_jigs.py` validates every jig against the
# schema wrench ships, not against a copy kept here (NFR-6).
dev = ["pytest", "coverage", "pyyaml", "wrench", "mypy"]

# wrench is not on a registry, so it is named by git URL, exactly as skid does.
# A path source would tie this repository to a sibling checkout and break a
# standalone clone.
[tool.uv.sources]
wrench = { git = "https://github.com/scriptedworld/wrench.git", subdirectory = "python" }

# One line length, declared once, and both tools pinned to it.
#
# 150 is the estate's number. Without this, neither tool enforces it: ruff's
# default rule set does not include E501 at all, so ruff checks no length, and
# pylint's default of 100 is the only limit in play. Lines at 101 to 103
# characters then fail `analyse` against a limit nobody chose, while the
# declared standard goes unenforced; see
# `docs/LESSONS/a-dead-threshold-is-a-latent-relaxation.md`.
#
# `line-length` drives ruff's formatter as well as its linter. No file reflows
# at 150, because the formatter does not expand code already wrapped shorter.
[tool.ruff]
line-length = 150

[tool.ruff.lint]
# E501 is line length, and it is selected explicitly because ruff's defaults
# leave it out. Declaring the number without selecting the rule would set a
# limit nothing enforces.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# N999 is "invalid module name", and this file's name is deliberate: the
# adapters and checkers are scripts bolt invokes by path, never modules imported
# by name, and the estate spells a script's name with hyphens throughout.
#
# It fires because these directories carry the `__init__.py` that lets coverage
# see an adapter no test executed. The marker changes how ruff classifies the
# file; it does not change what the file is or how it is reached.
"adapters/common/bolt-result.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# bin/test-traceability.py is a checker, not a test file. It does not match
# test_*.py because of the hyphen, and testpaths keeps collection out of bin/
# regardless; this keeps a later rename from turning it into a collected test
# module.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
# The roots, and the reason each adapter directory carries an `__init__.py`.
# coverage adds a file that no test executed to the report only where it can
# reach it as a package. The adapters are standalone scripts loaded by path, so
# without a marker in their directories the report carries the adapters that
# ran and silently omits every one that did not, where a per-file gate needs
# them reported at 0%.
#
# The leaf directories are not named here. Each Cobertura
# `filename` is relative to the source root that contains it, so with the leaves
# named, `adapters/go/coverage.py`, `adapters/python/coverage.py` and
# `adapters/lcov/coverage.py` all report as `coverage.py` and the adapter merges
# three different files into one entry. Two roots and a marker per subdirectory
# keeps the paths distinct.
source = ["bin", "adapters"]

[tool.coverage.report]
# The scripts are invoked and loaded by path, so the report names them by path.
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's: the jig
# runs a bare `mypy .` and says so in its own comment. What it needs from here
# is only that third-party imports resolve.
#
# `types-PyYAML` is not used because nothing in this repository declares
# runtime dependencies: bolt invokes these
# scripts by path against whatever interpreter anvil built. Revisit when anvil
# carries the stub packages: see NEXT_STEPS.
#
# `wrench` is listed because the tests import the pack that ships the jig
# schemas (NFR-6). It is resolvable at runtime by editable install and not by
# mypy's path. `jsonschema` and `referencing` are not listed: the suite calls
# the validator wrench ships and imports neither.
[[tool.mypy.overrides]]
module = ["yaml", "pytest", "wrench"]
ignore_missing_imports = true

# pylint runs only what ruff cannot, which is what the shared jig's header
# says. Without this table, a bare `pylint --recursive=y` runs pylint's entire
# default rule set: 16 findings here, one of them cross-module analysis and the
# rest rules ruff already runs.
#
# An allowlist, because a denylist would need updating every time ruff gains a
# rule. An allowlist errs by missing a new pylint check rather than running a
# duplicate. wrench uses the same shape with its own list.
#
# Every entry needs more than one file in view, or type inference.
# `duplicate-code` is the clearest case: ruff has no equivalent and cannot have
# one, because it is a whole-program question.
#
# Deliberately not here: `line-too-long` and `invalid-name` and `missing-function-docstring` are all
# single-file judgements. ruff owns line length above, at the estate's 150.
# The module names it objects to are hyphenated because these are executables
# invoked by path, not importable modules.
[tool.pylint."MESSAGES CONTROL"]
disable = ["all"]
enable = [
    "duplicate-code",
    "cyclic-import",
    "no-member",
    "not-callable",
    "no-value-for-parameter",
    "unexpected-keyword-arg",
    "import-error",
    "arguments-differ",
    "abstract-method",
    "attribute-defined-outside-init",
    "inconsistent-return-statements",
]
