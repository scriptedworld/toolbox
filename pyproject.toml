# Tool configuration only. This repository ships scripts that bolt invokes by
# path, never a package anyone installs, so there is no [project] table and
# nothing here builds a distribution.

[tool.pytest.ini_options]
testpaths = ["tests"]
# bin/test-traceability.py is a checker, not a test file. It does not match
# test_*.py because of the hyphen, and testpaths keeps collection out of bin/
# regardless, but saying so here means a later rename cannot quietly turn a
# checker into a collected test module.
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["bin", "adapters"]

[tool.coverage.report]
# The scripts are invoked by path and loaded by path, so show them by path.
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

# mypy strictness is this project's decision, not the shared jig's: the jig
# runs a bare `mypy .` and says so in its own comment. What it needs from here
# is only that third-party imports resolve.
#
# `types-PyYAML` is the better answer than ignoring yaml and is not used because
# nothing in this repository declares runtime dependencies: bolt invokes these
# scripts by path against whatever interpreter anvil built. Revisit when anvil
# carries the stub packages: see NEXT_STEPS.
#
# `wrench` joined the list 2026-08-29 when the local schema copies went and the
# tests began importing the pack that ships them, which settles NFR-6. It is
# resolvable at runtime by editable install and not by mypy's path.
#
# `jsonschema` and `referencing` left it the same day: the suite validated jigs
# by assembling its own validator and now calls the one wrench ships, so neither
# is imported here any more.
[[tool.mypy.overrides]]
module = ["yaml", "pytest", "wrench"]
ignore_missing_imports = true
