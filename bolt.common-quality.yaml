# bolt.common-quality.yaml, the checks that do not care what language you wrote.
#
#     bolt common-quality .
#
# Flags come before the positionals. The jig is named bare and read as
# bolt.<name>.yaml from --config-dir, which defaults to the directory.
#
# Everything here holds a document against the source, or measures a property of
# the source that has nothing to do with its language. Nothing here knows what a
# compiler is, so a new language gets these three for free.
#
# THE PATH RULE. A path resolves against {config_dir} if it travels with this
# file: a checker, an adapter, a linter's config. It stays relative to the base
# if it belongs to the project being checked: its source, its REQUIREMENTS.md,
# its SUPPRESSIONS. Getting this backwards is invisible in a repository whose
# jig sits at its own root, because the two are then the same directory, and it
# breaks for every adopter. README.md carries the measurement.
#
# COMPOSING THIS WITH A LANGUAGE JIG IS UNSETTLED. It used to be an overlay,
# `bolt -c common -c go`, and later files merged by id so a language jig could
# adjust a task here without restating it. The current CLI cannot express that.
# Nesting replaces it, and a nested jig has no id to override, so a language
# either accepts these numbers or declares a second task that disagrees with
# them. `clank/tasks/toolbox/port-the-jigs/10` holds the three candidate answers
# and none is chosen yet.

version: "1.0.0"

requires:
  - python3
  - lizard

definitions:
  requirements: REQUIREMENTS.md
  suppressions: SUPPRESSIONS
  # The directories adoption fills with this repository's own files, plus the
  # gitignored scratch every repository here keeps. Measured in agent-support:
  # `complexity` passed having read 23 functions across `bin/` and `adapters/`,
  # every one of them toolbox's code and none of the adopter's.
  #
  # One directory per placeholder, because lizard takes one glob per flag and a
  # placeholder cannot hold more than one argument: bolt quotes each
  # substitution as a single shell word.
  #
  # toolbox holds the real files rather than links and overrides these with
  # `--definitions toolbox`, which names `.ephemera` three times over.
  # `**/x/*` rather than `./x/*`, quoted whole. Left unquoted the shell expands
  # it into a file list before lizard sees it, and lizard then exits 2.
  excluded_one_glob: '**/.ephemera/*'
  excluded_two_glob: '**/bin/*'
  excluded_three_glob: '**/adapters/*'

tasks:
  # ---- documents held against the source ------------------------------------

  # A requirements document nobody is held to becomes decoration: it drifts from
  # the code, and the drift is invisible because nothing compares the two. Both
  # directions fail here, a test citing nothing and a settled requirement no
  # test cites. Closed 2026-08-20, and it tightens the verdict for adopters
  # upgrading past it.
  #
  # README.md has the status markers, the worked rows and the adopter numbers.
  #
  # The checker reads Go, Python and Rust tests. A language with a jig here but
  # no entry in its LANGUAGES table finds no tests at all, cites nothing, and
  # fails every requirement at once, so a new language jig adds its entry in
  # the same change.
  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  # The same argument, applied to what has been silenced. An unregistered pragma
  # is a suppression nobody justified, and a registered row with nothing behind
  # it is cover for whatever replaces it. A project with no pragmas and no
  # register passes. The checker's own docstring carries the case that produced
  # it.
  - name: suppressions
    description: every suppression is registered, and every entry is real
    command: python3 {config_dir}/bin/suppression-register.py --register {suppressions} .

  # ---- properties of the source, whatever the language ----------------------

  #   -C  cyclomatic complexity per function
  #   -a  parameter count
  #   -L  function length in lines
  #
  # RUN WITHOUT -w. Warnings-only mode suppresses lizard's summary table, and
  # that table is where total nloc, function count and average complexity come
  # from. They are printed whether the task passes or fails, because a number is
  # only useful as a series.
  #
  # THOSE STATISTICS REACH NOBODY YET. Reading them out of the summary is the
  # adapter's job, and `adapters/common/lizard.py` still speaks the retired
  # contract, so this task runs on the exit-code adapter and the numbers stay in
  # captured stdout. The verdict is unaffected: lizard exits 1 over threshold
  # and 0 under. `port-the-jigs/10` restores the reasons and the series.
  #
  # Test files are measured too. A test is read when it has just failed and
  # nobody knows why, so it has to be at least as readable as the code it
  # supports.
  - name: complexity
    description: no function over complexity 15, 5 parameters or 60 lines
    command: >-
      lizard -C 15 -a 5 -L 60
      -x {excluded_one_glob} -x {excluded_two_glob} -x {excluded_three_glob} .

  # ---- secrets ---------------------------------------------------------------

  # THE SECRETS JIG RUNS FROM HERE, COMPOSED RATHER THAN COPIED. Directed
  # 2026-08-29: the common jig should run the security one as well.
  #
  # Before this, "all the quality tooling" reached secret scanning nowhere. The
  # two sets were adopted separately, ten repositories to nine, so a project
  # running only its common gate scanned for no credentials at all and nothing
  # said so.
  #
  # COMPOSED, so `bolt.secrets.yaml` stays the single definition of what a
  # secret scan is. Copying the two tasks here would put detect-secrets'
  # configuration in two files free to drift, which is the fault this estate
  # spent two days finding in other shapes, and the drift would be between two
  # documents that both look authoritative.
  #
  # THE ADAPTER IS NOT OPTIONAL. Bolt exits 0 whenever it carried a run out,
  # whatever the tools concluded, so a composed task with no adapter passes
  # however badly the child failed. Measured 2026-08-29 on a deliberately
  # failing child: with the adapter `success=False`, without it `success=True`.
  # The adapter reads the child's result and folds its reasons up, so a
  # credential found by the child reports here as the child's own finding rather
  # than as a path to go and read.
  #
  # `--output-dir` is named because bolt refuses a directory that already holds
  # a run, and the child must not land in the parent's own.
  - name: secrets
    description: the secrets jig, run over this project as a child
    command: >-
      bolt --config-dir {config_dir} --output-dir {work_dir}/child
      secrets {base_dir}
    adapter: adapters/common/bolt-result.py
