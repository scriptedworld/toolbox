# Language-independent checks.  A new language gets these for free.
#
#     bolt common-quality .          flags before the positionals
#
# THE PATH RULE.  A path resolves against {config_dir} if it travels with this
# file: a checker, an adapter, a linter's config.  It stays relative to the base
# if it belongs to the project being checked: its source, REQUIREMENTS.md,
# SUPPRESSIONS.  Getting this backwards works in a repository whose jig sits at
# its own root, where the two are the same directory, and breaks for every
# adopter.
#
# WHAT IS LANGUAGE-INDEPENDENT IS NARROWER THAN IT LOOKED. Traceability,
# suppressions and secrets read text and do not care what language wrote it.
# Complexity read source and had to parse it, so it only appeared to be common:
# it lived here until 2026-09-03, and the note below the tasks says what
# measuring it in one place actually produced.

version: "1.0.0"

requires:
  - python3

definitions:
  requirements: REQUIREMENTS.md
  suppressions: SUPPRESSIONS

tasks:
  # ---- documents held against the source ------------------------------------

  # Fails both directions: a test citing nothing, and a settled requirement no
  # test cites.  README.md has the status markers and worked rows.
  #
  # Reads Go, Python and Rust tests.  A language with a jig here but no entry in
  # the checker's LANGUAGES table finds no tests and fails every requirement at
  # once, so a new language jig adds its entry in the same change.
  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  # An unregistered pragma is a suppression nobody justified; a registered row
  # with nothing behind it is cover for whatever replaces it.  A project with
  # neither passes.
  - name: suppressions
    description: every suppression is registered, and every entry is real
    command: python3 {config_dir}/bin/suppression-register.py --register {suppressions} .

  # ---- complexity is a language jig's, and no longer here --------------------
  #
  # `complexity` ran lizard at 15 CCN, 5 parameters and 60 lines for every
  # language at once. It has gone, and so has lizard from `requires`, because
  # every language jig here already runs a linter that measures the same things
  # natively and measures them better. Measured 2026-09-03:
  #
  #     metric        lizard                  the language's own
  #     cyclomatic    yes                     ruff C901 / golangci cyclop
  #     cognitive     NO SUCH METRIC          complexipy / gocognit / clippy
  #     nesting       Go yes, PYTHON ALWAYS 0 ruff PLR1702 / nestif / clippy
  #     arguments     yes                     ruff PLR0913 / clippy
  #     length        yes                     ruff PLR0915 / funlen / clippy
  #
  # TWO OF THOSE ROWS ARE WHY. lizard has no cognitive metric at all, and its
  # nesting extension reports 0 for every Python function while working on Go,
  # so the one jig that claimed to measure every language the same way was
  # measuring them differently and saying otherwise.
  #
  # The header's open question — whether a language jig accepts these numbers or
  # declares its own task — is answered: its own, because the numbers were never
  # the same numbers.
  #
  # THE COST IS THAT A NEW LANGUAGE STARTS WITH NO COMPLEXITY GATE, where it
  # used to inherit one. That is the honest trade: an inherited gate that cannot
  # measure the language it was pointed at is worse than an absent one, since
  # only the absent one is visible.

  # ---- secrets ---------------------------------------------------------------

  # THE SECRETS JIG RUNS FROM HERE, COMPOSED RATHER THAN COPIED. Directed
  # 2026-08-29: the common jig should run the security one as well.
  #
  # Before this, "all the quality tooling" reached secret scanning nowhere. The
  # two sets were adopted separately, ten repositories to nine, so a project
  # running only its common gate scanned for no credentials at all and nothing
  # said so.
  #
  # COMPOSED, so `bolt.secrets.yaml` stays the single definition of what a
  # secret scan is. Copying the two tasks here would put detect-secrets'
  # configuration in two files free to drift, which is the fault this estate
  # spent two days finding in other shapes, and the drift would be between two
  # documents that both look authoritative.
  #
  # THE ADAPTER IS NOT OPTIONAL. Bolt exits 0 whenever it carried a run out,
  # whatever the tools concluded, so a composed task with no adapter passes
  # however badly the child failed. Measured 2026-08-29 on a deliberately
  # failing child: with the adapter `success=False`, without it `success=True`.
  # The adapter reads the child's result and folds its reasons up, so a
  # credential found by the child reports here as the child's own finding rather
  # than as a path to go and read.
  #
  # `--output-dir` is named because bolt refuses a directory that already holds
  # a run, and the child must not land in the parent's own.
  - name: secrets
    description: the secrets jig, run over this project as a child
    command: >-
      bolt --config-dir {config_dir} --output-dir {work_dir}/child
      secrets {base_dir}
    adapter: adapters/common/bolt-result.py
