# Language-independent checks.  A new language gets these for free.
#
#     bolt common-quality .          flags before the positionals
#
# The path rule.  A path resolves against {config_dir} if it travels with this
# file: a checker, an adapter, a linter's config.  It stays relative to the base
# if it belongs to the project being checked: its source, REQUIREMENTS.md,
# SUPPRESSIONS.  Getting this backwards works in a repository whose jig sits at
# its own root, where the two are the same directory, and breaks for every
# adopter.
#
# Only checks that read text belong here. Traceability, suppressions and
# secrets do not care what language wrote the file. Complexity has to parse
# source, so it is not common; the note below the tasks says why it lives in
# each language jig.

version: "1.0.0"

requires:
  - python3

definitions:
  requirements: REQUIREMENTS.md
  suppressions: SUPPRESSIONS

  # Belongs to the project: one SHA, the commit the gate landed at. Commits
  # after it are judged; without the file, commits are not judged at all.
  voice_start_file: .voice-review-start

tasks:
  # ---- documents held against the source ------------------------------------

  # Fails both directions: a test citing nothing, and a settled requirement no
  # test cites.  README.md has the status markers and worked rows.
  #
  # Reads Go, Python and Rust tests.  A language with a jig here but no entry in
  # the checker's LANGUAGES table finds no tests and fails every requirement at
  # once, so a new language jig adds its entry in the same change.
  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  # An unregistered pragma is a suppression nobody justified; a registered row
  # with nothing behind it is cover for whatever replaces it.  A project with
  # neither passes.
  - name: suppressions
    description: every suppression is registered, and every entry is real
    command: python3 {config_dir}/bin/suppression-register.py --register {suppressions} .

  # The wording the writing standard names, found by pattern with no model, so
  # one instance fails and every run agrees. `bin/voice-tells.py` lists the
  # rules. The model review, `bin/voice-review.py`, reads the same text and is
  # not a task here: its findings do not repeat between runs, so it is run by
  # hand and never gates.
  - name: wording
    description: documentation, comments and commit messages carry none of the wording the writing standard names
    command: >-
      python3 {config_dir}/bin/voice-tells.py --all-files --base {base_dir}
      --start-file {voice_start_file} --report {work_dir}/voice-tells.json
    evidence:
      - voice-tells.json

  # ---- complexity belongs to each language jig -------------------------------
  #
  # There is no `complexity` task here and no lizard in `requires`. A single
  # lizard task at 15 CCN, 5 parameters and 60 lines cannot serve every
  # language, and every language jig already runs a linter that measures the
  # same things natively and better:
  #
  #     metric        lizard                  the language's own
  #     cyclomatic    yes                     ruff C901 / golangci cyclop
  #     cognitive     no such metric          complexipy / gocognit / clippy
  #     nesting       Go yes, Python always 0 ruff PLR1702 / nestif / clippy
  #     arguments     yes                     ruff PLR0913 / clippy
  #     length        yes                     ruff PLR0915 / funlen / clippy
  #
  # Two of those rows decide it. lizard has no cognitive metric at all, and its
  # nesting extension reports 0 for every Python function while working on Go,
  # so one common task would measure languages differently while claiming to
  # measure them the same way.
  #
  # That also settles whether a language jig accepts common numbers or declares
  # its own task (see NEXT_STEPS.md): its own, because the numbers are not the
  # same numbers.
  #
  # The cost is that a new language starts with no complexity gate. An
  # inherited gate that cannot measure the language it is pointed at is worse
  # than an absent one, since only the absent one is visible.

  # ---- secrets ---------------------------------------------------------------

  # The secrets jig runs from here as a child, composed and not copied, so a
  # project running only its common gate still scans for credentials. The two
  # sets can be adopted separately, and when they were, a common-only project
  # scanned for nothing and nothing said so.
  #
  # Composed, so `bolt.secrets.yaml` stays the single definition of what a
  # secret scan is. Copying the two tasks here would put detect-secrets'
  # configuration in two files free to drift, and both would look authoritative.
  #
  # The adapter is not optional. Bolt exits 0 whenever it carried a run out,
  # whatever the tools concluded, so a composed task with no adapter passes
  # however badly the child failed. On a deliberately failing child, the task
  # reports `success=False` with the adapter and `success=True` without it.
  # The adapter reads the child's result and folds its reasons up, so a
  # credential found by the child reports here as the child's own finding, not
  # as a path to go and read.
  #
  # `--output-dir` is named because bolt refuses a directory that already holds
  # a run, and the child must not land in the parent's own.
  - name: secrets
    description: the secrets jig, run over this project as a child
    command: >-
      bolt --config-dir {config_dir} --output-dir {work_dir}/child
      secrets {base_dir}
    adapter: adapters/common/bolt-result.py
