# The shared C++ formatting rules.
#
# Named on the command line as `--style=file:{config_dir}/config/cpp/clang-format.yaml`
# rather than dropped at a project root as `.clang-format`. clang-format finds a
# dotfile by walking up from each source file, which means the file a check uses
# depends on where the source sits, and an adopter with a stray `.clang-format`
# in a subdirectory would be gated by a different style than the one it adopted.
# An explicit path has one answer.
#
# This is the same reasoning as CLIPPY_CONF_DIR in the Rust jig and the
# golangci config in the Go one: the tool's configuration travels with the jig,
# because a shared standard that each adopter can restate is not shared.

BasedOnStyle: Google

# Four rather than Google's two. The estate's other languages indent four
# (rustfmt, gofmt's tab rendered at four, ruff), and a C++ file that reads
# differently from every other file here costs more than agreeing with upstream
# Google style does.
IndentWidth: 4

# 88 rather than Google's 80.
#
# IT DOES NOT MATCH ANY OTHER LANGUAGE HERE AND CANNOT, so the number is chosen
# on its own merits rather than for alignment. rustfmt uses 100, gofmt does not
# wrap at all, and this repository sets ruff to 150 deliberately, on the ground
# that a limit is for reviewability rather than for terminals.
#
# C++ is the language here whose lines grow without the author choosing it: a
# qualified template type is long before any identifier is. 88 is tight enough
# to push a long expression onto its own line, which is where a diff can name
# it, and clang-format WILL reflow existing code to reach it, unlike ruff's
# formatter, which leaves already-wrapped code alone. That asymmetry is why this
# number is a commitment and 150 was free.
ColumnLimit: 88

# A pointer binds to the type, not the name. `int* p` rather than `int *p`.
# Arbitrary, and settled here so it is not re-argued per file.
DerivePointerAlignment: false
PointerAlignment: Left

# Braces on every control statement, including single-statement bodies. This is
# the same rule clang-tidy's readability-braces-around-statements enforces, and
# having the formatter produce what the linter demands means the two never
# disagree about a file.
InsertBraces: true

# A trailing comma keeps a one-line diff to one line when an entry is added.
#
# IT DOES NOT WORK ALONE, and clang-format refuses the file rather than warning:
# `trailing comma insertion cannot be used with bin packing`. Google style bin
# packs, so both must be turned off, and that is a style decision rather than a
# workaround. Bin packing fills a wrapped line with as many arguments as fit, so
# adding one argument reflows the others and the diff names lines nobody
# touched. One argument per wrapped line costs vertical space and makes a diff
# say what changed.
BinPackArguments: false
BinPackParameters: false
InsertTrailingCommas: Wrapped

# Includes sorted and grouped. Left to Google's grouping, which puts the
# matching header first: that is the ordering include-what-you-use assumes when
# it reports, so a different grouping here would produce churn between the two
# tools rather than agreement.
SortIncludes: CaseSensitive
