# What a project links in order to adopt a jig.  Use bin/link-toolbox.py.
#
# A definition alone is not enough: it names checkers, adapters and tool config
# that live beside it here, so adoption is a set of symlinks and this file says
# which.
#
# The list is declared and not derived, because a jig running `ruff check .`
# or `mypy .` needs config those tools find by convention and names nothing on
# the command line.
#
# Paths land at the same relative path in the target.  That is forced: a linked
# definition sits at the target's root, making `{config_dir}` the target's root,
# so `bin/x.py` has to be at `bin/x.py`.

version: 1

sets:
  # The ten recipes every project supplies whatever it is written in, imported
  # by an adopter's Justfile as `import 'just/base.just'`.
  #
  # A set of its own, included by nothing. Adopting the jigs and adopting the
  # recipe set are different decisions: a project can run the checks without a
  # Justfile, and can have a Justfile without adopting a jig. Folding this into
  # `common` would make one imply the other for no reason.
  #
  # It exists because five repositories already held byte-identical copies
  # (sha256 81db942f738d, 198 lines, all tracked) with no shared source, and
  # nothing would have detected them drifting apart.
  #
  # A repository holding several projects cannot take this at its root. A file
  # lands at the same relative path it has here, so a repository that wants one
  # `just/base.just` per subproject adopts per subproject and not once at the
  # top. `README.md` has the two adoption models and which to pick.
  base:
    files:
      - just/base.just

  # Checks that do not care what language the project is written in. Every
  # language set includes this one.
  #
  # Common includes secrets, and the arrow only points that way. The common jig
  # composes `bolt.secrets.yaml` as a child, so an adopter of `common` needs the
  # secrets definition on disk or that task cannot run. `secrets` still includes
  # nothing, because scanning a repository for credentials needs nothing else to
  # be true of it, and a project may adopt it alone.
  common:
    includes: [secrets]
    files:
      - bolt.common-quality.yaml
      - bin/test-traceability.py
      - bin/suppression-register.py
      # The composition adapter, which turns the child secrets run's verdict
      # into this jig's. Without it the composed task cannot fail.
      - adapters/common/bolt-result.py
      # The wording check, which gates, and the model review, which reports
      # and loads the wording check from beside itself, with its prompt.
      - bin/voice-tells.py
      - bin/voice-review.py
      - config/prompts/voice-findings.md
      # Named with `--definitions requirements-directory` by a repository whose
      # requirements are a directory. Linked so a linking adopter can name it
      # too; one gated from a checkout reads it here.
      - bolt.requirements-directory.definitions.yaml

  go:
    includes: [common]
    files:
      - bolt.go-std-quality.yaml
      - adapters/go/coverage.py
      - adapters/go/gofmt.py
      - adapters/go/govet.py
      - config/go-std-quality.golangci.yml

  # The coverage adapter is the only file besides the definition. Every other
  # tool here is off the shelf and its exit code is the answer. A shared ruff or mypy configuration would be the next entry to join,
  # and would be invisible to anything that tried to infer this list from the
  # definition's command lines.
  python:
    includes: [common]
    files:
      - bolt.python-std-quality.yaml
      - adapters/python/coverage.py

  # Adopted from bolt, which carried it while nothing here shipped a Rust jig.
  # The clippy config is listed for the same reason the golangci one
  # is: it travels with the jig, and nothing could infer it from a command line
  # because clippy finds it by directory through CLIPPY_CONF_DIR.
  rust:
    includes: [common]
    files:
      - bolt.rust-std-quality.yaml
      - adapters/lcov/coverage.py
      - config/rust/clippy.toml

  # The Ruby jig shipped with no set, so nothing could adopt it: `link-toolbox`
  # links what a set names, and no set named it. Its coverage task reads a
  # Cobertura report, which is the Python adapter's format, so the two sets
  # share that file the way `rust` and `typescript` share the lcov one.
  ruby:
    includes: [common]
    files:
      - bolt.ruby-std-quality.yaml
      - adapters/python/coverage.py
      - config/ruby-std-quality.rubocop.yml

  # The lcov adapter is shared with `typescript` and the two Node sets and
  # belongs to none of them. It lives in `adapters/lcov/` because it reads lcov, which
  # cargo-llvm-cov, gcovr and node's own test reporter all emit. Every set lists
  # it, all of them symlink the same file, and a project adopting two gets one
  # copy.
  #
  # It moved from `adapters/rust/` while only this repository referenced that
  # path, so no adopter had to re-link.

  # The Node toolchain, over a TypeScript project. Named for the toolchain and
  # not the language, which is the one set here that has to be: deno and bun run
  # the same language through entirely different tools, so a set called
  # `typescript` would promise something no single file can deliver. A
  # `deno-std-quality` set joins this list when a project adopts one, and is
  # held to the same category list rather than inventing its own.
  #
  # The shortest file list of any language set, and that is a property of the
  # ecosystem rather than of the jig: every tool it drives is an npm package the
  # adopter pins in its own `devDependencies`, so there is nothing to symlink
  # except the jig and the shared adapter.
  #
  # No linter configuration travels with it, where `go`, `ruby` and `rust` all
  # ship one. It cannot. An eslint config imports its parser,
  # `link-toolbox` places a file as a symlink, and node resolves a symlink to
  # its real path, so an eslint config linked from here would resolve
  # `typescript-eslint` against toolbox's `node_modules` and not the adopter's.
  # The jig's thresholds are definitions in its own file instead, passed with
  # eslint's `--rule`, which beats whatever the project's own config says.
  #
  # The adopter supplies four files of its own: `tsconfig.json`,
  # `eslint.config.js`, `knip.json` and a `package-lock.json`. That is a longer
  # contract than any other language set here asks for: it states something only
  # the project knows.
  node-std-quality:
    includes: [common]
    files:
      - bolt.node-std-quality.yaml
      - adapters/lcov/coverage.py

  # The Deno toolchain, over the same language. A separate set and not a variant
  # of the one above, because the two share no tool: every task in the deno jig
  # is a deno subcommand and every task in the node one reaches an npm package.
  #
  # It shares the lcov adapter with `node-std-quality` and `rust`, which is three
  # sets reading one file. That is what naming the adapter for its
  # format rather than for a language bought.
  #
  # Shorter than the Node set in what it gates, not in what it links. Deno's
  # built-ins leave complexity, duplicate detection, dead code, licences and
  # static security patterns open; the jig records each with the measurement.
  deno-std-quality:
    includes: [common]
    files:
      - bolt.deno-std-quality.yaml
      - adapters/lcov/coverage.py

  # The composite, which runs the engine jigs an adopter declares.
  #
  # It includes both engine sets rather than picking one, because an adopter
  # cannot know which it will declare until it writes its definitions file, and
  # a jig that is not on disk when its name is composed fails the run rather
  # than skipping. Linking both costs two symlinks.
  #
  # `adapters/common/bolt-result.py` arrives through `common`, which both engine
  # sets already include, so it is not listed twice. Without it the composed
  # task cannot fail: bolt exits 0 whenever it carried a run out, so a composed
  # task with no adapter passes however badly the child failed.
  typescript-std-quality:
    includes: [node-std-quality, deno-std-quality]
    files:
      - bolt.typescript-std-quality.yaml

  secrets:
    files:
      - bolt.secrets.yaml
