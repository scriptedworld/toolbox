# What a project links in order to adopt a jig.
#
# A definition is only half of what a project needs. It names checkers,
# adapters and tool configuration that live beside it here, and `{config_dir}`
# resolves those against the definition's own directory, so a definition reached
# through a symlink resolves them back through that same link. Adoption is
# therefore a set of symlinks, and this file says which.
#
# DECLARED, NOT DERIVED. A jig that runs `ruff check .`, `mypy .` or
# `pylint --recursive=y .` needs whatever configuration those tools read by
# convention and names none of it on the command line, so a list derived from
# the `{config_dir}` references would be correct today and wrong tomorrow.
#
# Paths are relative to this repository and land at the SAME relative path in
# the target, which is forced: a linked definition sits at the target's root,
# making `{config_dir}` the target's root, so `bin/x.py` has to be at `bin/x.py`
# for the definition to find it.

version: 1

sets:
  # The ten recipes every project supplies whatever it is written in, imported
  # by an adopter's Justfile as `import 'just/base.just'`.
  #
  # A SET OF ITS OWN, INCLUDED BY NOTHING. Adopting the jigs and adopting the
  # recipe set are different decisions: a project can run the checks without a
  # Justfile, and can have a Justfile without adopting a jig. Folding this into
  # `common` would make one imply the other and there is no reason it should.
  #
  # IT EXISTS BECAUSE THE COPIES ALREADY DID. Measured 2026-08-31: five
  # byte-identical copies, sha256 81db942f738d, 198 lines, all tracked, and no
  # shared source anywhere. Nothing detected that they agreed, so nothing would
  # have detected that they had stopped.
  #
  # WRENCH CANNOT TAKE THIS SET AS IT STANDS. A file lands at the same relative
  # path in the target, and wrench keeps its two copies per pack, at
  # `rust/just/base.just` and `python/just/base.just`. A root-relative linker
  # cannot produce those, so wrench needs either a per-pack adoption or a set
  # that can land one file at a different path. That is unresolved and is not
  # settled by adding this.
  base:
    files:
      - just/base.just

  # Checks that do not care what language the project is written in. Every
  # language set includes this one.
  #
  # COMMON INCLUDES SECRETS, and the arrow only points that way. The common jig
  # composes `bolt.secrets.yaml` as a child, so an adopter of `common` needs the
  # secrets definition on disk or that task cannot run. `secrets` still includes
  # nothing, because scanning a repository for credentials needs nothing else to
  # be true of it, and a project may adopt it alone.
  common:
    includes: [secrets]
    files:
      - bolt.common-quality.yaml
      - bin/test-traceability.py
      - bin/suppression-register.py
      - adapters/common/lizard.py
      # The composition adapter, which turns the child secrets run's verdict
      # into this jig's. Without it the composed task cannot fail.
      - adapters/common/bolt-result.py

  go:
    includes: [common]
    files:
      - bolt.go-std-quality.yaml
      - adapters/go/coverage.py
      - adapters/go/gofmt.py
      - adapters/go/govet.py
      - config/go-std-quality.golangci.yml

  # Every tool here is off the shelf and its exit code is the answer, so the
  # definition is currently the whole set. A shared ruff or mypy configuration
  # would be the first entry to join it, and would be invisible to anything
  # that tried to infer this list from the definition's command lines.
  python:
    includes: [common]
    files:
      - bolt.python-std-quality.yaml

  secrets:
    files:
      - bolt.secrets.yaml
