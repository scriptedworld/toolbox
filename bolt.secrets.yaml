# bolt.secrets.yaml, credentials do not belong in a repository.
#
#     bolt secrets .
#
# Its own jig rather than part of the common one. It runs on a different
# cadence, every push or nightly over full history rather than on every local
# iteration, and it is the one most likely to grow a third scanner.
#
# TWO SCANNERS, DELIBERATELY, because their false negatives differ:
#
#   gitleaks        rule-based, and reads git HISTORY as well as the working
#                   tree. A credential committed and then deleted is still in
#                   the pack files and still leaked; only a history scan sees it.
#   detect-secrets  entropy-based as well as rule-based, and keeps a reviewed
#                   BASELINE. A known false positive stays quiet without
#                   silencing the rule that found it, which is the difference
#                   between an audited exception and a disabled check.
#
# THE BASELINE BELONGS TO THE PROJECT, so `--baseline` stays relative to the
# base and not to {config_dir}, the same rule REQUIREMENTS.md and SUPPRESSIONS
# follow. A shared jig carrying one project's reviewed findings would judge
# every adopter against another project's answers.
#
# ROTATION IS NOT A CHECK. Neither task below can tell you whether a credential
# it found has been revoked. A scanner that goes green after a secret is deleted
# from the working tree has reported on the tree and not on the secret; the key
# is still valid until somebody rotates it. That step belongs to a person.
#
# A third scanner is an open question, not an omission. `trufflehog` verifies a
# finding by calling the provider's API, which makes it a decision about egress
# rather than about coverage. `clank/tasks/toolbox/jig-content/30` holds it, and
# records the answer in `docs/DECISIONS/` either way.

version: "1.0.0"

requires:
  - gitleaks
  - detect-secrets

definitions:
  baseline: .secrets.baseline

tasks:
  # Working tree and history in one pass. --redact keeps the finding out of the
  # artifact: an envelope naming the secret it found is itself a leak, and
  # artifacts get committed, uploaded to CI and pasted into issues.
  #
  # No baseline here. gitleaks allowlists through .gitleaks.toml in the project,
  # which it discovers on its own.
  - name: gitleaks
    description: no credential in the working tree or in history
    command: gitleaks detect --no-banner --redact

  # THIS TASK DOES NOT GATE, IN EITHER OF ITS TWO STATES. Measured, and tracked
  # as `own-gate/30`:
  #
  #   no baseline        argparse rejects the path before scanning, exit 2. No
  #                      adopter has one, so this is what every adopter gets.
  #   baseline present   `scan --baseline` is a baseline BUILDER. It absorbs a
  #                      new finding into the file and exits 0, so a fresh
  #                      credential makes the check rewrite its own record to
  #                      say the credential was reviewed, then reports success.
  #
  # It is left declared rather than removed because the gap is the point: a
  # missing task and a broken one look identical from a green run, and this one
  # fails loudly in the state every adopter is actually in.
  - name: detect-secrets
    description: no unreviewed secret, measured against the project's baseline
    command: >-
      detect-secrets scan --baseline {baseline}
      --exclude-files '^\.secrets\.baseline$'
