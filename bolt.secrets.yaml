# bolt.secrets.yaml — credentials do not belong in a repository.
#
# Its own jig rather than part of the common one, for two reasons. It is the
# check most likely to be run on a different cadence — every push, or nightly
# over full history, rather than on every local iteration. And it is the one
# most likely to grow: a second or third scanner is a normal thing to want here
# and an odd thing to bolt onto a jig about complexity and traceability.
#
#     bolt -c bolt.secrets.yaml
#     bolt -c bolt.common-quality.yaml -c bolt.go-std-quality.yaml -c bolt.secrets.yaml
#
# TWO SCANNERS, DELIBERATELY. They disagree in useful ways, and the disagreement
# is the point:
#
#   gitleaks        rule-based, and reads git HISTORY as well as the working
#                   tree. A credential committed and then deleted is still in
#                   the pack files and still leaked; only a history scan sees it.
#   detect-secrets  entropy-based as well as rule-based, and keeps a reviewed
#                   BASELINE. A known false positive stays quiet without
#                   silencing the rule that found it, which is the difference
#                   between an audited exception and a disabled check.
#
# Running one is worth much more than running neither. Running both is worth
# more than running either, because their false negatives are not the same
# false negatives.
#
# THE BASELINE BELONGS TO THE PROJECT, so `--baseline` is run-root-relative,
# not {configdir}-relative — the same rule REQUIREMENTS.md and SUPPRESSIONS
# follow. A shared jig carrying one project's reviewed findings would judge
# every adopter against another project's answers.

version: 1

tasks:
  # Working tree and history in one pass. --redact keeps the finding out of the
  # artifact: an envelope naming the secret it found is itself a leak, and
  # artifacts get committed, uploaded to CI and pasted into issues.
  #
  # No --baseline here: gitleaks' allowlisting lives in .gitleaks.toml in the
  # project, which it discovers on its own.
  - id: gitleaks
    description: no credential in the working tree or in history
    tags: [ci, secrets]
    requires: [gitleaks]
    command: "gitleaks detect --no-banner --redact"
    timeout: 300s

  # The reviewed-baseline half. A project with no .secrets.baseline is still
  # scanned — absence means "nothing has been reviewed yet", not "skip this".
  #
  # The baseline is excluded from its own scan: it is a catalogue of reviewed
  # findings, so scanning it reports every one of them straight back.
  - id: detect-secrets
    description: no unreviewed secret, measured against the project's baseline
    tags: [ci, secrets]
    requires: [detect-secrets]
    command: >-
      detect-secrets scan --baseline .secrets.baseline
      --exclude-files '^\.secrets\.baseline$'
    timeout: 300s

# ---- NOT HERE, AND WHY -------------------------------------------------------
#
# `trufflehog` — the obvious third scanner, and the one that goes further than
# both above: it VERIFIES findings by calling the provider's API to see whether
# a key is live. That is genuinely more useful than a pattern match, and it is
# also a network call to a third party carrying a credential found in your
# source. Adding it is a decision about egress, not about coverage, and it wants
# making deliberately rather than inheriting from a shared jig.
#
# Nor is it installed here. FACT 2026-08-18: `command -v trufflehog` finds
# nothing, so declaring it in `requires:` would fail the task rather than skip
# it — the correct behaviour, and the reason it is absent rather than optional.
#
# ROTATION IS NOT A CHECK. Neither task above can tell you whether a credential
# it found has been revoked. A scanner that goes green after a secret is deleted
# from the working tree has reported on the tree, not on the secret — the key is
# still valid until somebody rotates it. That step belongs to a person.
