# C++'s standard checks.
#
#     bolt cpp-std-quality .           flags before the positionals
#
# The contract is a compilation database, which sets this jig apart from every
# other one here.
#
# Go has `go`, Rust has `cargo`, Python has tools that all take `.`. C++ has no
# universal driver: nothing on a C++ project's command line knows what the
# project builds, with which standard, or against which include paths. Every
# analysis tool below therefore reads `compile_commands.json`, which is the
# project's own statement of what it compiles.
#
# An adopter produces one either way it builds:
#
#     cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ...
#     bear -- <any build command at all>
#
# `bear` is why this jig does not mandate CMake. It intercepts a build and
# records what was compiled, so a Makefile, a shell script or a hand-written
# g++ line all produce the same database.
#
# The jig does not build and does not run tests. Those are the adopter's
# commands and no fixed command line can express them. `tests` below reads a
# profile the adopter's own test run produced, declared as evidence.
#
# The standard, taken from the Python jig, which is the written statement of
# what should be validated for every language:
#
#     shape         a formatter that reports without writing, and a linter
#     correctness   types, and a test suite with coverage
#     security      known vulnerabilities, and the licences of what is linked
#     hygiene       dead code, documentation, complexity
#
# Where C++ differs, with each absence stated so it does not look like an
# oversight:
#
#   types          the compiler does it, as in Rust. There is no mypy-shaped
#                  task because there is no mypy-shaped gap.
#   vulnerabilities  a real gap, not a decision. There is no
#                  `cargo audit` counterpart because there is no manifest to
#                  audit: C++ has no estate-wide dependency declaration, so
#                  nothing here can enumerate what is linked. An adopter using
#                  Conan or vcpkg has a manifest and could gate it; one
#                  vendoring sources has nothing. The gap is tracked, not
#                  hidden.
#   licences       absent for the same reason and it is the same gap.
#   dead code      -Wunused-* is a compiler warning, and a build with
#                  -Werror is where it fails. Not a task here, as in Rust.
#   docstrings     no counterpart. C++ has no interrogate and no
#                  `missing_docs` lint, and a comment-density check measures
#                  the wrong thing.
#   complexity     folded into `lint`, as Rust folds it into clippy, because
#                  clang-tidy is already building an AST.
#   headers        a task no other language here has. include-what-you-use
#                  reports every header a file uses without including and every
#                  one it includes without using. Neither Go nor Rust has a
#                  counterpart, because neither has textual inclusion to get
#                  wrong.
#
# Ordered cheapest first, so a failure surfaces before the slow checks run.

version: "1.0.0"

requires:
  - clang-format
  - clang-tidy
  # A separate binary from clang-tidy, and the one that drives it across a
  # database. Naming only clang-tidy is the failure `requires` exists to catch:
  # a run that gets two tasks in before discovering the third cannot start.
  - run-clang-tidy
  - cppcheck
  - include-what-you-use
  - iwyu_tool
  - gcovr
  - python3

definitions:
  # The compilation database, relative to the base. An adopter that writes it
  # into a build directory overrides this instead of moving the file.
  database: compile_commands.json

  # Which headers clang-tidy reports on. `^$` matches nothing, so the default is
  # to report on translation units alone. An adopter with headers of its own
  # sets this to a regex matching them, and only the adopter knows what that is.
  header_filter: ^$

  # Per-file coverage minima. Lines and branches both, which C++ can do and Rust
  # cannot: gcovr emits BRDA records by default, while cargo-llvm-cov on stable
  # 1.98.1 emits none and its --branch flag fails outright. See the note on the
  # `tests` task.
  min_line: "80"
  min_branch: "80"

  # The same three exclusions as the Python jig, in the two shapes these tools
  # take. `bin` and `adapters` are where an adopter's links into toolbox land,
  # and a slot cannot be left empty without changing a command's shape; see
  # `bolt.toolbox.definitions.yaml`.
  #
  #   excluded_one/two/three   path prefixes, for cppcheck's -i
  #   excluded_regex           one regex over all three, for clang-format-check
  #                            and gcovr
  excluded_one: .ephemera
  excluded_two: bin
  excluded_three: adapters
  excluded_regex: (^|/)(\.ephemera|bin|adapters)/

tasks:
  # ---- shape ----------------------------------------------------------------

  # clang-format is the one tool here with no directory mode and no project
  # mode, so a checker reads the database and hands it the files. Running it
  # over a glob instead would report vendored and generated sources the project
  # cannot act on.
  #
  # --dry-run reports without writing. A formatter that reformats during a check
  # is a check with a side effect, and in CI it produces a green run against a
  # tree nobody has seen.
  - name: format
    description: every compiled file is clang-format clean
    command: >-
      python3 {config_dir}/bin/clang-format-check.py
      --style {config_dir}/config/cpp/clang-format.yaml
      --database {database}
      --base .
      --exclude {excluded_regex}

  # run-clang-tidy walks the database. The configuration carries the check list,
  # the complexity thresholds and WarningsAsErrors, so nothing about the
  # standard is on this command line.
  #
  # -quiet is passed through to clang-tidy and does not quieten run-clang-tidy
  # itself. run-clang-tidy 19 still prints the
  # `[1/2][0.0s] clang-tidy-19 …` banner per translation unit, and there is no
  # flag that stops it. The flag is kept because it suppresses clang-tidy's own
  # per-file `N warnings generated` line, which is the noisier of the two on a
  # real tree; the banner is noise the task lives with.
  - name: lint
    description: clang-tidy including complexity, with warnings refused
    command: >-
      run-clang-tidy -quiet
      -p .
      -config-file={config_dir}/config/cpp/clang-tidy.yaml
      -header-filter={header_filter}

  # A second analyser on purpose, and the one place the C++ jig has more than Go
  # or Rust. cppcheck and clang-tidy are built on different engines and find
  # different things: on the same 76-line file, cppcheck alone reported a
  # useless substr call and a pass-by-value that clang-tidy's full check set did
  # not.
  #
  # --error-exitcode=1 is required. cppcheck exits 0 on findings by default, so
  # without it this task passes while printing its own failures.
  #
  # --suppress=unmatchedSuppression is required too; the task fails without it.
  # `--enable=all` turns on `unmatchedSuppression`, which reports a suppression
  # that matched nothing, and that report is itself an error under
  # `--error-exitcode=1`. The three suppressions above are for informational
  # messages cppcheck emits conditionally: `normalCheckLevelMaxBranches` only on
  # a function with enough branches. A two-file fixture too small to trigger it
  # failed the task with `Unmatched suppression: normalCheckLevelMaxBranches`.
  #
  # So a conditional suppression makes the check fail on exactly the small,
  # simple trees it should pass. Suppressing the unmatched report is what makes
  # the other three safe to state.
  - name: analyse
    description: cppcheck over the same database, for what a different engine finds
    command: >-
      cppcheck --project={database}
      --enable=all
      --error-exitcode=1
      --inline-suppr
      --suppress=missingIncludeSystem
      --suppress=checkersReport
      --suppress=normalCheckLevelMaxBranches
      --suppress=unmatchedSuppression
      -i{excluded_one}
      -i{excluded_two}
      -i{excluded_three}

  # ---- hygiene --------------------------------------------------------------

  # No other language jig here has this task, because no other language here has
  # textual inclusion. iwyu reports both directions: a header used without being
  # included, and a header included without being used.
  #
  # It is the only tool that reports the second, which is why clang-tidy's
  # misc-include-cleaner is disabled in the shared configuration instead of run
  # beside it. Two tools failing for one defect sends the author round twice.
  - name: headers
    description: every file includes what it uses and uses what it includes
    command: iwyu_tool -p . -- -Xiwyu --error=1

  # ---- correctness ----------------------------------------------------------

  # Coverage is judged from a profile the adopter's own test run produced. This
  # jig does not run the suite: no fixed command line can, because C++ has no
  # universal test driver. The adopter builds with --coverage, runs its tests,
  # and this reads what gcov left behind.
  #
  # Lines and branches both, and C++ is one of two languages here that can:
  #
  #   gcovr 7.2                emits BRDA by default. A fixture with one
  #                            untaken branch reported BRF:4 BRH:3.
  #   cargo-llvm-cov, stable   emits no BRDA at all, BRF:0 BRH:0, and
  #     rustc 1.98.1           `--branch` fails outright with exit 101 because
  #                            it passes -Z coverage-options=branch.
  #
  # So the Rust jig sets no branch minimum and this one does. Python gates
  # branches too; Go has no branch mode at all. The four languages are not level
  # on this, and the jigs say so instead of reporting a guarantee nothing
  # established.
  #
  # The adapter is shared with Rust and is not specific to it. It reads lcov,
  # which gcovr and cargo-llvm-cov both emit, and it judges per file at the
  # minima above. An aggregate threshold is what lets a well-tested file carry
  # an untested one.
  - name: tests
    description: coverage judged per file for lines and branches, from the profile
    command: >-
      gcovr --root . --lcov {work_dir}/coverage.lcov
      --exclude {excluded_regex}
    evidence:
      - coverage.lcov
    adapter: adapters/lcov/coverage.py
